name: PhoneAI Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PHONEAI_OPENCL: "0"
      PHONEAI_NDK_VERSION: "29.0.13113456"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.22.1"

      - name: Prepare local AI runtimes
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/*.sh || true
          ./scripts/setup_llama.sh
          ./scripts/setup_whisper.sh
          ./scripts/setup_sherpa_onnx.sh

      - name: Verify project
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/verify_project.py

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          GGML_HOME="$PWD/third_party/llama.cpp/ggml"
          test -d "$GGML_HOME"
          gradle :app:assembleDebug -PGGML_HOME="$GGML_HOME" --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          test -n "$APK"
          cp "$APK" PhoneAI-debug.apk
          sha256sum PhoneAI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAI-debug
          path: PhoneAI-debug.apk
          if-no-files-found: error
          retention-days: 14
